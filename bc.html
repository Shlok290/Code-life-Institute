<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Booking</title>
    <style>
        * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f8fafc;
    margin: 0;
    padding: 30px;
}
.booking-container {
    max-width: 1000px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 30px;
    display: flex;
    gap: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.form-section {
    flex: 1.8;
}

.form-section h2 {
    margin-top: 0;
    color: #0f172a;
    font-size: 24px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
    font-size: 14px;
}

.row {
    display: flex;
    gap: 15px;
}

.form-group {
    flex: 1;
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #334155;
    margin-bottom: 6px;
}

input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #2563eb;
}

textarea {
    resize: vertical;
}

.btn-submit {
    width: 100%;
    background-color: #2563eb;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.btn-submit:hover {
    background-color: #1d4ed8;
}
    </style>
</head>
<body>
    <div class="booking-container">
        <div class="form-section">
            <h2>Online Course Registration & Booking</h2>
            <p class="subtitle">Select your course, batch timings, and calculate estimated enrollment fee instantly.</p>

            <form>
                <div class="row">
                    <div class="form-group">
                        <label>Student enrollment number *</label>
                        <input type="text" placeholder="Enter enrollment number " required>
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" placeholder="student@gmail.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Select Course *</label>
                        <select required>
                            <option value="">-- Choose Course --</option>
                            <option>Full Stack Web Engineering (₹18,500)</option>
                            <option>Python & Data Analytics (₹16,000)</option>
                            <option>UI/UX & Responsive Systems (₹14,500)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Batch Schedule *</label>
                        <select required>
                            <option>Morning Batch (09:00 AM - 11:30 AM)</option>
                            <option>Evening Batch (04:00 PM - 06:30 PM)</option>
                            <option>Weekend Batch (Sat - Sun)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Special Request or Notes</label>
                    <textarea rows="4" placeholder="Mention laptop availability, prior background, etc."></textarea>
                </div>

                <button type="submit" class="btn-submit">Confirm Online Course Booking</button>
            </form>
        </div>
        
</body>
</html>
